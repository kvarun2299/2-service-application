<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Products | Fieldnote</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js?v=2" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Fieldnote home">
          <span class="brand-mark" aria-hidden="true">F</span>
          <span>fieldnote</span>
        </a>
        <span class="system-status"><span class="status-dot"></span>Inventory workspace</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR CATALOG</p>
        <h1 id="page-title">Products, in one place.</h1>
        <p class="intro-copy">Keep your inventory tidy. Add an item or remove one you no longer carry.</p>
      </section>

      <section class="content-grid" aria-label="Product management">
        <form id="product-form" class="panel product-form">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">NEW ITEM</p>
              <h2>Add a product</h2>
            </div>
            <span class="heading-icon" aria-hidden="true">+</span>
          </div>

          <label for="name">Product name <span class="required">*</span></label>
          <input id="name" name="name" type="text" maxlength="255" placeholder="e.g. Everyday ceramic mug" required>

          <label for="price">Price <span class="required">*</span></label>
          <div class="price-input">
            <span aria-hidden="true">$</span>
            <input id="price" name="price" type="number" min="0" max="99999999.99" step="0.01" placeholder="0.00" required>
          </div>

          <label for="description">Description <span class="optional">OPTIONAL</span></label>
          <textarea id="description" name="description" rows="4" placeholder="A short note about this product"></textarea>

          <button id="submit-button" class="button button-primary" type="submit">
            <span>Add product</span><span aria-hidden="true">→</span>
          </button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <section class="panel catalog-panel" aria-labelledby="catalog-title">
          <div class="panel-heading catalog-heading">
            <div>
              <p class="eyebrow">INVENTORY</p>
              <h2 id="catalog-title">Your products <span id="product-count" class="count-badge">0</span></h2>
            </div>
            <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh products" title="Refresh">↻</button>
          </div>
          <div id="catalog-message" class="catalog-message" role="status" aria-live="polite">Loading products…</div>
          <ul id="product-list" class="product-list" aria-label="Products"></ul>
        </section>
      </section>

      <footer class="footer"><span>FIELDNOTE INVENTORY</span><span>Simple by design.</span></footer>
    </main>
  </body>
</html>
